[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcpmessage"
version = "1.3.2"
description = "package for retrieving GOES DCS message data from LRGS servers."
authors = [{ name = "dcpmessage authors" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "N"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "setuptools>=80.9.0",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
]
